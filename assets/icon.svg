<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background App Tile -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#10b981" stroke-width="3" opacity="0.25"/>

  <!-- Passport Booklet Silhouette -->
  <g filter="url(#cardShadow)">
    <rect x="116" y="80" width="280" height="352" rx="24" fill="#044e39" stroke="#34d399" stroke-width="4"/>
    <rect x="116" y="80" width="24" height="352" rx="12" fill="#022c22" opacity="0.6"/>
  </g>

  <!-- Gold Emblem Circle -->
  <circle cx="256" cy="220" r="62" fill="none" stroke="url(#goldGrad)" stroke-width="5"/>
  <circle cx="256" cy="220" r="46" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Compass / Star inside -->
  <polygon points="256,176 268,208 300,208 274,228 284,260 256,242 228,260 238,228 212,208 244,208" fill="url(#goldGrad)"/>

  <!-- Biometric ICAO Chip Symbol -->
  <rect x="216" y="336" width="80" height="48" rx="10" fill="none" stroke="url(#goldGrad)" stroke-width="6"/>
  <line x1="192" y1="360" x2="216" y2="360" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
  <line x1="296" y1="360" x2="320" y2="360" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="256" cy="360" r="12" fill="url(#goldGrad)"/>
</svg>